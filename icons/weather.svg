<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Weather">
  <defs>
    <linearGradient id="weather-bg" x1="25" y1="18" x2="156" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312300"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#2a1800"/>
    </linearGradient>
    <linearGradient id="weather-line" x1="49" y1="48" x2="136" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff27a"/>
      <stop offset="0.52" stop-color="#ffd400"/>
      <stop offset="1" stop-color="#ff9f1c"/>
