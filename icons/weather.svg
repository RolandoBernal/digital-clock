    <radialGradient id="weather-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(73 66) rotate(48) scale(88 75)">
      <stop stop-color="#ffd400" stop-opacity="0.32"/>
      <stop offset="0.54" stop-color="#ffd400" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffd400" stop-opacity="0"/>
